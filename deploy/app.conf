# aufheben.top 的 nginx vhost
#
# 这份文件是仓库侧的模板，服务器上的实际文件在 /etc/nginx/sites-enabled/home。
# 部署 workflow 不会整份覆盖它（服务器上还有 certbot 生成的证书路径等），
# 只会幂等地补齐「HTML 不缓存」那一行，避免 CDN / 腾讯云 EO 把旧 index.html 缓存住。
#
# 改这份文件前先确认服务器上的现状，别两边打架。

# ===== 端口 80: 直接提供内容（供 EdgeOne HTTP 回源，也供 certbot 验证）=====
server {
    listen 80;
    listen [::]:80;
    server_name aufheben.top www.aufheben.top;
    root /var/www/home/dist;
    index index.html;
    # certbot webroot 验证路径（必须在提供内容之前，且不跳转）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # html-no-store：index.html 每次都要回源拿新的，否则边缘缓存会把旧版本一直发下去
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}

# ===== 端口 443: 同一份内容 =====
server {
    listen 443 ssl;
    listen [::]:443 ssl http2;
    server_name aufheben.top www.aufheben.top;
    ssl_certificate /etc/letsencrypt/live/aufheben.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aufheben.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/home/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # html-no-store：index.html 每次都要回源拿新的，否则边缘缓存会把旧版本一直发下去
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
